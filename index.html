<title>30-Day Growth Plan</title>

<style>
:root {
  --bg:#06060a; --bg2:#0c0c14; --bg3:#12121e; --border:#1a1a28; --border2:#252538;
  --text:#d4d4e0; --text2:#888898; --text3:#555566; --accent:#4ade80; --accent2:#22c55e;
  --adim:rgba(74,222,128,0.08);
  --jp:#F4511E; --guitar:#eab308; --leet:#4ade80; --school:#a855f7;
  --job:#ef4444; --gym:#f87171; --poke:#fb923c; --work:#3b82f6;
  --mono:'IBM Plex Mono','SF Mono','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.5;min-height:100dvh;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:16px 16px 100px;position:relative}
.header{padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.header-row{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:1.5px}
.logo span{color:var(--accent)}
.day-pill{background:var(--adim);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:1px;border:1px solid rgba(74,222,128,0.15)}
.subline{font-size:11px;color:var(--text3);margin-top:5px}
.nav{display:flex;gap:2px;background:var(--bg2);border-radius:8px;padding:3px;margin-bottom:14px}
.nav button{flex:1;padding:9px 4px;background:transparent;color:var(--text3);border:none;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;transition:all .2s}
.nav button.active{background:var(--bg3);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px;animation:fu .2s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:12px}

/* Schedule timeline */
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(26,26,40,.6);position:relative;animation:fu .2s ease}
.tl-item:last-child{border-bottom:none}
.tl-item.now{background:rgba(74,222,128,.04);margin:0 -16px;padding:10px 16px;border-radius:8px;border:1px solid rgba(74,222,128,.12);border-bottom:1px solid rgba(74,222,128,.12)}
.tl-item.past{opacity:.4}
.tl-time{width:52px;flex-shrink:0;font-size:10px;color:var(--text3);padding-top:2px;line-height:1.6}
.tl-time .end{color:var(--text3);opacity:.5}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:12px;color:#fff;font-weight:500;display:flex;align-items:center;gap:6px}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-desc{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5}
.tl-now-badge{font-size:8px;background:var(--accent);color:#000;padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tl-transition{padding:4px 0;border-bottom:1px solid rgba(26,26,40,.3)}
.tl-transition .tl-title{font-size:11px;color:var(--text3);font-weight:400}

/* Log blocks */
.block{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--text3);border-radius:8px;margin-bottom:6px;overflow:hidden;animation:fu .2s ease}
.block-head{width:100%;padding:13px 14px;background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:13px}
.block-status{font-size:10px;letter-spacing:.5px}
.block-status.done{color:var(--accent)}
.block-status.empty{color:var(--text3)}
.block-body{padding:0 14px 16px;animation:fu .15s ease}
.field{margin-bottom:12px}
.field-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:500}
.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 11px;font-family:var(--mono);font-size:12px;resize:vertical;outline:none;transition:border .2s;line-height:1.5}
.field textarea:focus{border-color:var(--border2);box-shadow:0 0 0 2px rgba(74,222,128,.06)}
.field textarea::placeholder{color:var(--text3);font-size:11px}

/* Day nav */
.day-nav{display:flex;gap:6px;margin-top:16px}
.day-nav button{flex:1;padding:11px 8px;background:var(--bg2);color:var(--text2);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:11px;transition:all .15s}
.day-nav button:active{transform:scale(.97)}
.day-nav .today-btn{color:var(--accent);border-color:rgba(74,222,128,.2)}

/* Calendar grid */
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.cal-header span{text-align:center;font-size:9px;color:var(--text3);padding:4px;letter-spacing:1px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);font-family:var(--mono);transition:all .15s;gap:1px}
.cal-cell:active{transform:scale(.93)}
.cal-cell .num{font-size:12px;color:var(--text2)}
.cal-cell .pct{font-size:7px;color:var(--accent);font-weight:600}
.cal-cell.current{border-color:var(--accent)}
.cal-cell.current .num{color:var(--accent)}
.cal-cell.has-data{background:var(--adim)}
.cal-spacer{aspect-ratio:1}

/* Send */
.sync-desc{font-size:11px;color:var(--text2);line-height:1.8;margin-bottom:14px}
.sync-btn{width:100%;padding:13px;background:linear-gradient(135deg,#0a2a18,#0d3320);color:var(--accent);border:1px solid rgba(74,222,128,.2);border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.5px;transition:all .2s}
.sync-btn:active{transform:scale(.98)}
.divider{border-top:1px solid var(--border);margin:16px 0}
.log-preview{margin-top:14px;padding:12px;background:var(--bg);border-radius:6px;font-size:10px;color:var(--text3);overflow:auto;max-height:200px;white-space:pre-wrap;border:1px solid var(--border);line-height:1.7}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg3);color:var(--accent);padding:8px 24px;border-radius:24px;font-size:12px;font-family:var(--mono);z-index:999;border:1px solid var(--border2);box-shadow:0 8px 24px rgba(0,0,0,.5);animation:ti .25s ease;pointer-events:none}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.footer{margin-top:32px;text-align:center;font-size:9px;color:var(--text3);letter-spacing:.5px;opacity:.6}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>

  {t:"10:30",e:"11:00",label:"Wind Down",emoji:"🌙",color:"#795548",type:"routine",desc:"Prep for Monday"},
];

// ===== CURRICULUM =====
const JP = ["Anki core deck + Hiragana review (50)","Katakana review + Anki (50)","Genki I Ch1 vocab + は/が","Genki I Ch1 workbook + listening","Genki I Ch2 vocab + です/ます","Genki I Ch2 + NHK Easy News","Week 1 review + catch-up","Genki I Ch3 verb conjugation","Genki I Ch3 て-form practice","Genki I Ch3 workbook + shadowing","Genki I Ch4 adjectives (い/な)","Genki I Ch4 grammar + reading","Genki I Ch4 workbook + listening","Week 2 review + conversation","Genki I Ch5 past tense","Genki I Ch5 counters + drills","Genki I Ch5 workbook + NHK","Genki I Ch6 て-いる form","Genki I Ch6 relative clauses","Genki I Ch6 workbook + shadowing","Week 3 review + N5 quiz","Genki I Ch7 giving/receiving","Genki I Ch7 short form","Genki I Ch7 workbook + immersion","Genki I Ch8 short form practice","Genki I Ch8 と思う/と言う","Genki I Ch8 workbook + reading","Week 4 review + reflection","Comprehensive review 1","Review 2 + month 2 goals"];
const GT = ["Am pent pos 1 — slow tempo","Pos 1 + vibrato intro","Am pent pos 2","Pos 1-2 connection + jam","Pos 3 + bending intro","3 positions + song","Consolidation jam","Pos 4 + hammer-ons","Pos 4 + pull-offs","Pos 5 — full neck!","Full neck drilling","Vibrato + bending deep dive","Song practice","Week 2 jam + record","Blues scale (♭5)","5 classic blues licks","Blues over 12-bar","Power chords + palm muting","Rhythm + lead switching","Alternate picking speed","Week 3 full review","Target weak areas","Pentatonic Em, Dm","Intermediate song","Song + dynamics","Clean playing focus","Full repertoire marathon","Record 2-min improv","Explore new territory","Final jam + reflection"];
const LC = ["Two Sum + Contains Duplicate","Valid Anagram + Group Anagrams","Top K Frequent + Product of Array","Encode/Decode + Longest Consecutive","Valid Palindrome + Two Sum II","3Sum + Container","Review — redo failed","Buy/Sell Stock + Longest Substring","Longest Repeating + Min Window","Valid Parens + Min Stack","Generate Parens + Daily Temps","Binary Search + Search 2D","Koko Bananas + Rotated Array","Review — pattern drill","Reverse List + Merge Lists","List Cycle + Reorder","Invert Tree + Max Depth","Same Tree + Subtree","Level Order + Validate BST","Kth Smallest + LCA","Review — trees & lists","Islands + Clone Graph","Pacific Atlantic + Course Sched","Climbing Stairs + House Robber","Coin Change + LIS","Unique Paths + Decode Ways","Mock interview","Pattern cheat sheet","Catch-up hardest","Final mock interview"];

const JOB_DAYS = new Set([1,4,8,11,15,18,22,25,29]);

const BLOCKS = [
  {id:"japanese",emoji:"🇯🇵",label:"Japanese",color:"var(--jp)",fields:[
    {key:"anki_done",label:"Anki cards completed",ph:"e.g. 35/50",rows:1},
    {key:"grammar",label:"Grammar covered",ph:"e.g. て-form, は vs が",rows:1},
    {key:"struggles",label:"Struggles",ph:"What was hard?",rows:2},
    {key:"adjust",label:"Adjustment needed?",ph:"e.g. need more time on Ch3",rows:2},
  ]},
  {id:"guitar",emoji:"🎸",label:"Guitar",color:"var(--guitar)",fields:[
    {key:"completed",label:"What I practiced",ph:"e.g. pos 1-2 transitions, vibrato",rows:1},
    {key:"time_mins",label:"Total minutes today",ph:"e.g. 90",rows:1},
    {key:"fun",label:"Fun level (1-10)",ph:"1-10",rows:1},
    {key:"adjust",label:"Adjustment needed?",ph:"e.g. need more bending work",rows:2},
  ]},
  {id:"leetcode",emoji:"💻",label:"LeetCode",color:"var(--leet)",fields:[
    {key:"done",label:"Problems completed",ph:"e.g. Two Sum ✓, Group Anagrams ✗",rows:1},
    {key:"patterns",label:"Patterns used",ph:"e.g. hash map, two pointer",rows:1},
    {key:"stuck",label:"Stuck on",ph:"What tripped you up?",rows:2},
    {key:"adjust",label:"Adjustment needed?",ph:"e.g. need another day on sliding window",rows:2},
  ]},
  {id:"school",emoji:"📚",label:"School",color:"var(--school)",fields:[
    {key:"done",label:"Modules completed",ph:"e.g. Stats 101 quiz 3",rows:1},
    {key:"notes",label:"Notes",ph:"Anything to flag",rows:2},
  ]},
  {id:"jobapps",emoji:"📝",label:"Job Apps",color:"var(--job)",fields:[
    {key:"companies",label:"Companies applied to",ph:"e.g. Anduril, Boeing",rows:1},
    {key:"resumes",label:"Resumes tailored",ph:"e.g. 2 — SWE and SecEng",rows:1},
    {key:"network",label:"Networking",ph:"e.g. messaged Kangsu",rows:1},
  ]},
  {id:"gym",emoji:"🏋️",label:"Gym",color:"var(--gym)",fields:[
    {key:"workout",label:"Workout",ph:"e.g. upper body, 45 min",rows:1},
    {key:"notes",label:"Notes",ph:"",rows:1},
  ]},
];

// ===== STATE =====
let S = { data:{}, day:getDayNum(), tab:"today", openBlock:null, toast:null };

function getDayNum() {
  const diff = Math.floor((new Date()-START)/864e5);
  return Math.max(1,Math.min(DAYS,diff+1));
}
function fmtDate(n) {
  const d=dayDate(n);
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function dayDate(n) { const d=new Date(START); d.setDate(d.getDate()+n-1); return d; }
function isGym(n) { const dow=dayDate(n).getDay(); return (dow===1||dow===4); }
function isSat(n) { return dayDate(n).getDay()===6; }
function isSun(n) { return dayDate(n).getDay()===0; }
function isWeekend(n) { return isSat(n)||isSun(n); }
function isJobDay(n) { return JOB_DAYS.has(n) && !isWeekend(n); }

function load() { try { const r=localStorage.getItem(SK); if(r) S.data=JSON.parse(r); } catch{} }
function save() { try { localStorage.setItem(SK,JSON.stringify(S.data)); } catch{} }
function getF(d,b,k) { return (S.data[`${d}_${b}`]||{})[k]||""; }
function setF(d,b,k,v) { const key=`${d}_${b}`; if(!S.data[key]) S.data[key]={}; S.data[key][k]=v; save(); }
function hasData(d,b) { const x=S.data[`${d}_${b}`]; return x&&Object.values(x).some(v=>v&&v.trim()); }
function completionPct(d) {
  let f=0,t=0;
  for(const b of BLOCKS){for(const field of b.fields){t++;if(getF(d,b.id,field.key))f++;}}
  return t?Math.round(f/t*100):0;
}

function getSchedule(dayNum) {
  const sat=isSat(dayNum), sun=isSun(dayNum), gym=isGym(dayNum)&&!isWeekend(dayNum);
  const jobDay=isJobDay(dayNum);
  const jp=JP[dayNum-1]||"Review", gt=GT[dayNum-1]||"Free practice", lc=LC[dayNum-1]||"Review";

  let template;
  if(sat) template=JSON.parse(JSON.stringify(SATURDAY));
  else if(sun) template=JSON.parse(JSON.stringify(SUNDAY));
  else template=JSON.parse(JSON.stringify(WEEKDAY));

  // Gym swap
  if(gym && !sat && !sun) {
    const gi=template.findIndex(x=>x.label==="Guitar Block 1");
    if(gi>=0){template[gi].label="Gym";template[gi].emoji="🏋️";template[gi].color="var(--gym)";template[gi].type="gym";template[gi].desc="Compound lifts or cardio";}
  }

  // Fill curriculum + evening block
  for(const item of template) {
    item.desc=item.desc.replace("_japanese_",jp).replace("_guitar_",gt).replace("_leetcode_",lc);
    if(item.label==="_evening_") {
      if(jobDay){item.label="Job Applications";item.emoji="📝";item.color="var(--job)";item.type="jobapps";item.desc="Tailor 1-2 resumes. Quality > quantity.";}
      else{item.label="School: Study.com / WGU";item.emoji="📚";item.color="var(--school)";item.type="school";item.desc="Coursework — one module at a time";}
    }
    if(item.emoji==="_eveemoji_"){item.emoji=jobDay?"📝":"📚";}
    if(item.color==="_evecolor_"){item.color=jobDay?"var(--job)":"var(--school)";}
    if(item.type==="_evetype_"){item.type=jobDay?"jobapps":"school";}
    if(item.desc==="_evedesc_"){item.desc=jobDay?"Tailor 1-2 resumes":"Coursework session";}
  }
  return template;
}

function parseTime(str) {
  // Handle "8:30p" style
  let pm = str.includes("p");
  let s = str.replace("p","");
  let [h,m] = s.split(":").map(Number);
  if(pm && h < 12) h += 12;
  if(!pm && h < 7) h += 12; // Assume PM for times like 1:00, 2:30 etc
  return h * 60 + (m||0);
}

function fmtTime12(str) {
  let mins = parseTime(str);
  let h = Math.floor(mins/60);
  let m = mins%60;
  let ampm = h >= 12 ? "p" : "a";
  if(h > 12) h -= 12;
  if(h === 0) h = 12;
  return `${h}:${String(m).padStart(2,"0")}${ampm}`;
}

function currentMinute() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function buildLog() {
  const d=S.day;
  let log=`Day ${d}/30 (${fmtDate(d)}) — Progress Log\n\nPLANNED:\n  Japanese: ${JP[d-1]}\n  Guitar: ${GT[d-1]}\n  LeetCode: ${LC[d-1]}\n\nACTUAL:\n`;
  for(const b of BLOCKS){
    const bd=S.data[`${d}_${b.id}`];
    if(!bd||!Object.values(bd).some(v=>v?.trim())) continue;
    log+=`\n${b.emoji} ${b.label}:\n`;
    for(const f of b.fields){if(bd[f.key]?.trim()) log+=`  ${f.label}: ${bd[f.key]}\n`;}
  }
  log+=`\nPlease review my progress vs the plan and adjust my remaining schedule. If I fell behind, redistribute across upcoming days.`;
  return log;
}

function showToast(msg){S.toast=msg;render();setTimeout(()=>{S.toast=null;render();},2500);}
async function copyLog(){try{await navigator.clipboard.writeText(buildLog());showToast("Copied!");}catch{showToast("Copy failed");}}

// ===== DOM HELPERS =====
function h(tag,attrs,...ch){
  const el=document.createElement(tag);
  if(attrs){for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class")el.className=v;
    else if(k==="html")el.innerHTML=v;
    else el.setAttribute(k,v);
  }}
  for(const c of ch){if(typeof c==="string")el.appendChild(document.createTextNode(c));else if(c)el.appendChild(c);}
  return el;
}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

// ===== RENDERERS =====
function renderHeader(){
  const d=S.day;
  const sat=isSat(d),sun=isSun(d),gym=isGym(d)&&!isWeekend(d);
  let sub=fmtDate(d);
  if(sat)sub+=" — 🐟 Poke Saturday";
  else if(sun)sub+=" — 🐟 Poke Sunday";
  if(gym)sub+=" — 🏋️ Gym Day";
  if(isJobDay(d))sub+=" — 📝 App Day";
  return h("div",{class:"header"},
    h("div",{class:"header-row"},h("div",{class:"logo",html:"30-DAY <span>PLAN</span>"}),h("div",{class:"day-pill"},`DAY ${d}`)),
    h("div",{class:"subline"},sub)
  );
}

function renderNav(){
  const nav=h("div",{class:"nav"});
  for(const[key,label]of[["today","Schedule"],["log","Log"],["cal","Calendar"],["sync","Send"]]){
    nav.appendChild(h("button",{class:S.tab===key?"active":"",onClick:()=>{S.tab=key;render();}},label));
  }
  return nav;
}

function renderSchedule(){
  const frag=document.createDocumentFragment();
  const sched=getSchedule(S.day);
  const now=currentMinute();
  const isToday = S.day===getDayNum();

  for(const item of sched){
    const startMin=parseTime(item.t);
    const endMin=parseTime(item.e);
    const isCurrent=isToday && now>=startMin && now<endMin;
    const isPast=isToday && now>=endMin;
    const isBreak=item.type==="break";

    const cls=isBreak?"tl-item tl-transition":`tl-item${isCurrent?" now":""}${isPast?" past":""}`;
    const row=h("div",{class:cls});

    const timeCol=h("div",{class:"tl-time"});
    timeCol.appendChild(h("div",null,fmtTime12(item.t)));
    if(!isBreak) timeCol.appendChild(h("div",{class:"end"},fmtTime12(item.e)));
    row.appendChild(timeCol);

    const body=h("div",{class:"tl-body"});
    const titleRow=h("div",{class:"tl-title"});
    if(!isBreak) titleRow.appendChild(h("div",{class:"tl-dot",style:{background:item.color}}));
    titleRow.appendChild(h("span",null,`${item.emoji} ${item.label}`));
    if(isCurrent) titleRow.appendChild(h("span",{class:"tl-now-badge"},"NOW"));
    body.appendChild(titleRow);

    if(!isBreak && item.desc){
      body.appendChild(h("div",{class:"tl-desc"},item.desc));
    }
    row.appendChild(body);
    frag.appendChild(row);
  }

  // Day nav
  const nav=h("div",{class:"day-nav"});
  nav.appendChild(h("button",{onClick:()=>{S.day=Math.max(1,S.day-1);render();}},`← Day ${Math.max(1,S.day-1)}`));
  nav.appendChild(h("button",{class:"today-btn",onClick:()=>{S.day=getDayNum();render();}},"Today"));
  nav.appendChild(h("button",{onClick:()=>{S.day=Math.min(DAYS,S.day+1);render();}},`Day ${Math.min(DAYS,S.day+1)} →`));
  frag.appendChild(nav);
  return frag;
}

function renderLog(){
  const frag=document.createDocumentFragment();
  const d=S.day;
  const gym=isGym(d)&&!isWeekend(d);

  for(const b of BLOCKS){
    if(b.id==="gym"&&!gym)continue;
    if(b.id==="jobapps"&&!isJobDay(d))continue;
    if(b.id==="school"&&isJobDay(d))continue;
    const open=S.openBlock===b.id;
    const has=hasData(d,b.id);
    const block=h("div",{class:"block",style:{borderLeftColor:b.color}});
    block.appendChild(h("button",{class:"block-head",onClick:()=>{S.openBlock=open?null:b.id;render();}},
      h("span",null,`${b.emoji} ${b.label}`),
      h("span",{class:`block-status ${has?"done":"empty"}`},`${has?"✓ logged":"tap to log"} ${open?"▲":"▼"}`)
    ));
    if(open){
      const body=h("div",{class:"block-body"});
      for(const f of b.fields){
        const field=h("div",{class:"field"});
        field.appendChild(h("div",{class:"field-label"},f.label));
        const ta=h("textarea",{rows:f.rows||1,placeholder:f.ph||""});
        ta.value=getF(d,b.id,f.key);
        ta.addEventListener("input",e=>setF(d,b.id,f.key,e.target.value));
        field.appendChild(ta);
        body.appendChild(field);
      }
      block.appendChild(body);
    }
    frag.appendChild(block);
  }

  const nav=h("div",{class:"day-nav"});
  nav.appendChild(h("button",{onClick:()=>{S.day=Math.max(1,S.day-1);render();}},`← Day ${Math.max(1,S.day-1)}`));
  nav.appendChild(h("button",{class:"today-btn",onClick:()=>{S.day=getDayNum();render();}},"Today"));
  nav.appendChild(h("button",{onClick:()=>{S.day=Math.min(DAYS,S.day+1);render();}},`Day ${Math.min(DAYS,S.day+1)} →`));
  frag.appendChild(nav);
  return frag;
}

function renderCalendar(){
  const frag=document.createDocumentFragment();
  const hdr=h("div",{class:"cal-header"});
  for(const d of["S","M","T","W","T","F","S"])hdr.appendChild(h("span",null,d));
  frag.appendChild(hdr);
  const grid=h("div",{class:"cal-grid"});
  const firstDow=dayDate(1).getDay();
  for(let i=0;i<firstDow;i++)grid.appendChild(h("div",{class:"cal-spacer"}));
  for(let i=1;i<=DAYS;i++){
    const pct=completionPct(i);
    const cur=i===getDayNum();
    const cls=["cal-cell"];if(cur)cls.push("current");if(pct>0)cls.push("has-data");
    const cell=h("button",{class:cls.join(" "),style:pct>0?{background:`rgba(74,222,128,${pct/250})`}:{},onClick:()=>{S.day=i;S.tab="today";render();}},
      h("div",{class:"num"},String(i)),
      pct>0?h("div",{class:"pct"},`${pct}%`):null
    );
    grid.appendChild(cell);
  }
  frag.appendChild(grid);
  return frag;
}

function renderSend(){
  const card=h("div",{class:"card"});
  card.appendChild(h("div",{class:"card-label"},"Send to Claude"));
  card.appendChild(h("p",{class:"sync-desc"},`Copy your Day ${S.day} log and paste it into Claude. Claude reads your progress, adjusts your schedule, and tells you what changes were made.`));
  card.appendChild(h("button",{class:"sync-btn",onClick:copyLog},"📋 Copy Day "+S.day+" Log"));
  card.appendChild(h("div",{class:"divider"}));
  const steps=h("div",{class:"sync-desc"});
  steps.innerHTML="<strong style='color:#fff'>Nightly routine:</strong><br>1. Log progress in each block<br>2. Tap this button<br>3. Paste into Claude → get adjusted plan";
  card.appendChild(steps);
  card.appendChild(h("pre",{class:"log-preview"},buildLog()));
  return card;
}

function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  if(S.toast)app.appendChild(h("div",{class:"toast"},S.toast));
  app.appendChild(renderHeader());
  app.appendChild(renderNav());
  if(S.tab==="today")app.appendChild(renderSchedule());
  else if(S.tab==="log")app.appendChild(renderLog());
  else if(S.tab==="cal")app.appendChild(renderCalendar());
  else if(S.tab==="sync")app.appendChild(renderSend());
  app.appendChild(h("div",{class:"footer"},"Data stored locally in your browser."));
}

// Auto-refresh current block highlight every minute
setInterval(()=>{if(S.tab==="today"&&S.day===getDayNum())render();},60000);

load();
render();
</script>
